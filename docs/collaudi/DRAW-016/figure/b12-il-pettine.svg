<text x="18" y="20" font-family="Helvetica,Arial,sans-serif" font-size="7.4" fill="#111111" font-weight="bold" font-style="normal" text-anchor="start">B12 — il pettine, e dove l&#8217;impianto 5 non ci sta</text>
<text x="18" y="27.5" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#7b8a8b" font-weight="normal" font-style="normal" text-anchor="start">Figura di spiegazione. Non &#232; una tavola e non fa convenzione grafica (D-165). Rosso = mandata, blu = ritorno. Ogni utenza si prende da un lato solo (D-167).</text>
<rect x="18" y="36" width="186" height="176" fill="none" stroke="#d5d8dc" stroke-width="0.5"/>
<rect x="216" y="36" width="186" height="176" fill="none" stroke="#d5d8dc" stroke-width="0.5"/>
<text x="26" y="46" font-family="Helvetica,Arial,sans-serif" font-size="4.5" fill="#111111" font-weight="bold" font-style="normal" text-anchor="start">A &#183; IL PETTINE — come l&#8217;hai disegnato tu</text>
<text x="26" y="51.5" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="#7b8a8b" font-weight="normal" font-style="italic" text-anchor="start">due colonne, e bastano</text>
<text x="224" y="46" font-family="Helvetica,Arial,sans-serif" font-size="4.5" fill="#111111" font-weight="bold" font-style="normal" text-anchor="start">B &#183; COME LA SKILL L&#8217;AVEVA LETTO — sbagliato</text>
<text x="224" y="51.5" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="#7b8a8b" font-weight="normal" font-style="italic" text-anchor="start">un ritorno inverso che il progettista non aveva chiesto (D-172)</text>
