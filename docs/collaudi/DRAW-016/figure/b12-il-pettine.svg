<text x="262" y="196" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#b9770e" font-weight="normal" font-style="normal" text-anchor="middle">il ritorno del radiante</text>
<text x="262" y="200.5" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#b9770e" font-weight="normal" font-style="normal" text-anchor="middle">risale da solo</text>
<text x="338" y="186" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="#b9770e" font-weight="normal" font-style="normal" text-anchor="end">e la sua coppia si apre subito</text>
<text x="300" y="196" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#c0392b" font-weight="bold" font-style="normal" text-anchor="start">1 &#8594; 2 &#8594; 3 sulla mandata</text>
<text x="300" y="202" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#2471a3" font-weight="bold" font-style="normal" text-anchor="start">3 &#8594; 1 &#8594; 2 sul ritorno</text>
<text x="300" y="208.5" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="#b9770e" font-weight="bold" font-style="normal" text-anchor="start">ordine rovesciato: una colonna in pi&#249;</text>
<line x1="18" y1="220" x2="402" y2="220" stroke="#d5d8dc" stroke-width="0.5"/>
<text x="18" y="228" font-family="Helvetica,Arial,sans-serif" font-size="3.9" fill="#111111" font-weight="bold" font-style="normal" text-anchor="start">La differenza, in una riga.</text>
<text x="18" y="234.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">Nel pettine la mandata incontra le utenze nell&#8217;ordine 1-2-3 e il ritorno</text>
<text x="18" y="239.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">le raccoglie nello stesso ordine: due colonne bastano. Nell&#8217;impianto 5 la</text>
<text x="18" y="244.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">mandata serve il radiante per ultimo e il ritorno lo raccoglie per primo,</text>
<text x="18" y="249.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">attaccato al volano. Il suo ritorno deve risalire tutta la colonna, e per non</text>
<text x="18" y="254.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">passare addosso al nodo che raccoglie UTA e ventilconvettori si prende</text>
<text x="18" y="259.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">una terza verticale.</text>
<text x="216" y="228" font-family="Helvetica,Arial,sans-serif" font-size="3.9" fill="#111111" font-weight="bold" font-style="normal" text-anchor="start">Non era una domanda (D-172).</text>
<text x="216" y="234.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">Il testo dice &#171;dal volume tecnico partono tre circuiti secondari&#187; e li elenca:</text>
<text x="216" y="239.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">&#232; una dorsale sola, e su una dorsale sola il ritorno specchia la mandata.</text>
<text x="216" y="244.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">Il ritorno inverso l&#8217;aveva messo la skill, scrivendo le catene di raccordi nel</text>
<text x="216" y="249.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">verso del flusso &#8212; e c&#8217;era anche sul primario. Corretto nel grafo, e la regola</text>
<text x="216" y="254.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">sta in &#171;Capire&#187; &#167;4.4. Il PO: &#171;se il progettista vuole due dorsali</text>
<text x="216" y="259.5" font-family="Helvetica,Arial,sans-serif" font-size="3.3" fill="#111111" font-weight="normal" font-style="normal" text-anchor="start">distinte lo dice&#187;. La skill disegna, e aggiunge i componenti secondari.</text>
</svg>