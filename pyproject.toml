[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disegnatore-mep"
version = "1.15.0"
description = "Deterministic foundation for technical MEP schematics"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
# Il DXF (REL-004): ezdxf, MIT, scrive un DXF che AutoCAD apre. E' facoltativo
# perche' porta con se' numpy e fonttools, e il nucleo non ne ha bisogno.
dxf = [
  "ezdxf==1.4.4",
]
dev = [
  "ezdxf==1.4.4",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
disegnatore-mep = "disegnatore_mep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disegnatore_mep = ["py.typed", "diametri/tubi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# 3.12, non 3.11: numpy arriva con ezdxf e i suoi stub usano la sintassi di Python 3.12
# (`type X = ...`). Con "3.11" mypy si fermava li', prima di controllare il nostro codice, e
# per settimane e' sembrato «un problema dell'ambiente» mentre gli errori veri crescevano
# sotto (REL-024). Il minimo di 3.11 lo tiene la CI, che fa girare le prove anche su 3.11.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["disegnatore_mep"]
mypy_path = ["src", "tests/collaudo"]
explicit_package_bases = true

